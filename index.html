  .say-hello:hover{background:linear-gradient(90deg,#E7F99A 0%,#ffffff 100%)}
  .say-hello .arrow{display:inline-flex;align-items:center;justify-content:center}
  .say-hello .arrow #arrow-lottie{width:24px;height:24px}

  .hero{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
        justify-content:center;padding:40px 24px;overflow:hidden}
  .marquee{position:absolute;top:50%;left:0;width:100%;transform:translateY(-50%);
        display:flex;overflow:hidden;pointer-events:none;z-index:1;
        -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
        mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .marquee__track{display:flex;align-items:center;flex:0 0 auto;
        animation:scroll 24s linear infinite}
  .marquee .brand{flex:0 0 auto;height:34px;display:flex;align-items:center;margin-right:74px}
  .marquee .brand img{height:34px;width:auto;display:block;filter:brightness(0);opacity:.7}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-33.3333%)}}

  .hero__frame{position:relative;z-index:2;width:400px;max-width:100%;display:flex;flex-direction:column;gap:8px}
  .hero__row{display:flex;justify-content:space-between;align-items:center}
  .hero__img{position:relative;width:400px;height:536px;max-width:100%;overflow:hidden;background:var(--bg);
        cursor:pointer;transform:translateZ(0);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1)}
  .hero__img img{width:100%;height:100%;object-fit:cover;display:block;
        clip-path:inset(100% 0 0 0);animation:reveal 1.2s cubic-bezier(.5,0,.1,1) .25s forwards;
        transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .7s cubic-bezier(.2,.8,.2,1)}
  .hero__img:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(16,16,16,.12)}
  .hero__img:hover img{transform:scale(1.055);filter:contrast(1.03) saturate(1.03)}
  @media (prefers-reduced-motion:reduce){
    .hero__img,.hero__img img{transition:none}
    .hero__img:hover{transform:none}
    .hero__img:hover img{transform:none}
  }
  .underline{width:56px;height:4px;background:var(--magenta)}
  .disclaimer{position:absolute;bottom:26px;left:0;width:100%;text-align:center;font-size:12.8px;color:var(--muted);z-index:2;padding:0 24px}
