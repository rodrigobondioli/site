"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Cada workspace nasce numa cópia própria do repo: precisa instalar as
# dependências dele, senão o next não roda.
[scripts]
setup = "npm install"
# concurrent: dois workspaces podem servir ao mesmo tempo, cada um na sua
# porta. É o ponto de usar o Conductor aqui — comparar duas versões lado a
# lado sem uma derrubar a outra.
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

# Confere se a exportação estática ainda passa antes de abrir PR. O site é
# output: "export" — erro de build aqui é erro de deploy na Vercel.
[scripts.run.build]
command = "npm run build"
icon = "hammer"
