<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de exercícios · N.A.V.E.</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/shared.css">
<link rel="stylesheet" href="/estrategia/ui.css">
<style>
.busca{width:min(420px,100%);padding:12px 16px;border:1px solid var(--ink-10);border-radius:99px;
 background:var(--bnd-white);font:inherit;outline:none;margin:6px 0 34px}
.busca:focus{border-color:var(--bnd-ink)}
.pilar{margin:0 0 40px}
.pilar h2{font-family:var(--bnd-display);font-weight:800;font-size:20px;letter-spacing:-.3px;margin:0 0 4px}
.pilar p{font-size:13.5px;color:var(--ink-50);margin:0 0 16px;max-width:70ch;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:var(--bnd-white);border:0;border-radius:var(--bnd-radius);padding:20px;
 text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:132px}
.card:hover{outline:1px solid var(--ink-25)}
.card.ess{background:var(--bnd-lime)}
.card .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
 letter-spacing:.4px;color:var(--ink-50)}
.card .nm{font-family:var(--bnd-display);font-weight:800;font-size:16.5px;line-height:1.2;flex:1}
.card .pe{font-size:12px;color:var(--ink-50);display:flex;gap:10px}
/* ficha */
.ficha{position:fixed;inset:0;background:rgba(16,16,16,.35);z-index:60;display:none;
 place-items:end center;padding:40px 20px 0}
.ficha.on{display:grid}
.ficha .box{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--bnd-bg);
 border-radius:var(--bnd-radius) var(--bnd-radius) 0 0;padding:34px 36px}
.ficha h3{font-family:var(--bnd-display);font-weight:800;font-size:26px;letter-spacing:-.4px;margin:8px 0 10px}
.ficha .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.ficha .intro{font-size:14.5px;line-height:1.55;color:rgba(16,16,16,.75);
 border-left:2px solid var(--ink-10);padding-left:14px;margin-bottom:22px}
.ficha ol{margin:0;padding-left:20px}
.ficha li{font-size:15px;line-height:1.4;padding:8px 0;border-top:1px dashed var(--ink-10)}
.ficha li:first-child{border-top:0}
.ficha li .h{display:block;font-size:12.5px;color:var(--ink-50);margin-top:4px;line-height:1.45}
.rot{font-size:11.2px;letter-spacing:1.12px;color:var(--ink-25);margin:24px 0 6px}
.mini{font-size:12px;color:var(--ink-50)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/shared/logo.svg" alt="Bondioli" onerror="this.outerHTML='<b style=&quot;font-family:var(--bnd-display);font-weight:800;font-size:16px&quot;>BOND</b>'">
      <span>estratégia</span>
    </div>
    <div class="navsec">Trabalho</div>
    <a class="navbtn" href="/estrategia/">Projetos</a>
    <div class="navsec">Consulta</div>
    <a class="navbtn" href="/estrategia/metodo/PLAYBOOK-NAVE.html">Playbook N.A.V.E.</a>
    <a class="navbtn on" href="/estrategia/exercicio.html">Catálogo de exercícios</a>
    <div class="navsec">Conta</div>
    <button class="navbtn" onclick="NAVE.logout()">Sair</button>
  </aside>

  <main class="main">
    <div class="kicker">Consulta</div>
    <h1>Catálogo de exercícios</h1>
    <p class="sub">Para ler e montar a sessão. Preencher é dentro de um projeto, no workshop.</p>
    <input class="busca" id="q" placeholder="Buscar exercício…">
    <div id="lista"></div>
  </main>
</div>

<div class="ficha" id="ficha" onclick="if(event.target===this)fechar()">
  <div class="box" id="fichaBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/estrategia/config.js"></script>
<script src="/estrategia/nave.js"></script>
<script>
const PILAR = [
  ['N','Negócio','Entender a configuração do negócio, os objetivos e as vantagens. Entender o negócio, jamais desenvolvê-lo.'],
  ['A','Audiência','Quem a marca atende, quem ela quer atender e o que essas pessoas precisam.'],
  ['V','Valor','A proposta de valor da marca e a dos players que prometem a mesma coisa.'],
  ['E','Estória','A verdade da marca: origem, crenças, propósito e personalidade.'],
  ['X','Fora do workshop','Primeira call, diagnóstico, estratégia, naming, identidade verbal e visual.'],
];
let CAT=null, CAMPOS={};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eixo = e => ['N','A','V','E'].includes(e.axis) && e.phase_id === 'F3' ? e.axis : 'X';

(async function(){
  if (!await NAVE.guard()) return;
  CAT = await NAVE.catalogo();
  CAT.fields.forEach(f => (CAMPOS[f.exercise_id] ||= []).push(f));
  Object.values(CAMPOS).forEach(a => a.sort((x,y)=>x.ord-y.ord));
  render();
  $('q').addEventListener('input', () => render($('q').value));
})();

function render(filtro=''){
  const f = filtro.trim().toLowerCase();
  $('lista').innerHTML = PILAR.map(([k, nome, desc]) => {
    const lista = CAT.exercises
      .filter(e => eixo(e) === k)
      .filter(e => !f || (e.id+e.name+(e.source||'')).toLowerCase().includes(f))
      .sort((a,b)=>a.id.localeCompare(b.id,'pt',{numeric:true}));
    if (!lista.length) return '';
    return `<section class="pilar"><h2>${nome}</h2><p>${desc}</p>
      <div class="cards">${lista.map(card).join('')}</div></section>`;
  }).join('') || '<p class="mini">Nada encontrado.</p>';
}

function card(e){
  const ess = e.tier === 'espinha' || (!e.tier && e.minimum);
  return `<button class="card ${ess?'ess':''}" onclick="abrir('${e.id}')">
    <span class="cod">${e.id}${ess ? ' · essencial' : ''}</span>
    <span class="nm">${esc(e.name)}</span>
    <span class="pe"><span>${e.duration_min||'—'} min</span>
    <span>${(CAMPOS[e.id]||[]).length} perguntas</span></span></button>`;
}

function abrir(code){
  const e = CAT.exercises.find(x => x.id === code); if (!e) return;
  const campos = CAMPOS[code] || [];
  const ess = e.tier === 'espinha' || (!e.tier && e.minimum);
  $('fichaBox').innerHTML = `
    <div class="kicker">${e.id} · ${e.axis==='-'?'fora do workshop':'eixo '+e.axis}</div>
    <h3>${esc(e.name)}</h3>
    <div class="meta">
      ${ess ? '<span class="tarja">essencial</span>' : '<span class="tarja tarja--line">por sinal</span>'}
      <span class="tarja tarja--line">${e.duration_min||'—'} min</span>
      ${e.blocos ? `<span class="tarja tarja--line">${e.blocos} blocos × ${e.min_bloco} min</span>` : ''}
      ${e.source ? `<span class="tarja tarja--line">${esc(e.source)}</span>` : ''}
    </div>
    ${e.porque ? `<p class="intro">${esc(e.porque)}</p>` : ''}
    ${e.intro ? `<p class="intro">${esc(e.intro)}</p>` : ''}
    <div class="rot">perguntas</div>
    <ol>${campos.map(c => `<li>${esc(c.label)}${c.hint?`<span class="h">${esc(c.hint)}</span>`:''}</li>`).join('')}</ol>
    ${e.tempo_fonte ? `<p class="mini" style="margin-top:22px">tempo: ${esc(e.tempo_fonte)}</p>` : ''}
    <div style="display:flex;gap:8px;margin:26px 0 6px">
      <button class="btn btn--line" onclick="fechar()">fechar</button>
    </div>`;
  $('ficha').classList.add('on');
}
function fechar(){ $('ficha').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key==='Escape') fechar(); });
</script>
</body>
</html>
