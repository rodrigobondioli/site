<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcas · Estratégia</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/shared.css">
<link rel="stylesheet" href="/estrategia/app.css">
</head>
<body class="lista">

<div class="page">
  <div class="top">
    <div>
      <h1>Marcas</h1>
      <p>Fechou contrato? Abre a marca aqui. Os 16 passos do método já entram montados, em ordem.</p>
    </div>
    <div style="display:flex;gap:10px">
      <a class="b b--ghost" href="/estrategia/metodo/PLAYBOOK-NAVE.html">Método</a>
      <button class="b" onclick="abrir()">Nova marca</button>
    </div>
  </div>
  <div id="lista"><p style="color:var(--i28)">Carregando…</p></div>
  <p style="margin-top:40px"><button class="b b--ghost sm" onclick="NAVE.logout()">Sair</button></p>
</div>

<div class="dlg" id="dlg">
  <div class="bx2">
    <h2>Nova marca</h2>
    <form id="form">
      <div class="f"><label>Nome da marca</label><input name="cliente" required placeholder="Bem-V" autocomplete="off"></div>
      <div class="f2">
        <div class="f"><label>Segmento</label><input name="segmento" placeholder="Cosmético natural" autocomplete="off"></div>
        <div class="f"><label>E-mail do contato</label><input name="email" type="email" autocomplete="off"></div>
      </div>
      <div class="f"><label>A marca já existe?</label>
        <select name="existe">
          <option value="sim">Sim — vamos reposicionar</option>
          <option value="nao">Não — marca nova do zero</option>
        </select></div>
      <div class="f"><label>Como você chama esse trabalho</label><input name="projeto" required placeholder="Reposicionamento 2026" autocomplete="off"></div>
      <div class="f2">
        <div class="f"><label>Início</label><input name="inicio" type="date"></div>
        <div class="f"><label>Entrega prevista</label><input name="fim" type="date"></div>
      </div>
      <div class="er" id="err"></div>
      <div style="display:flex;gap:10px">
        <button class="b" id="ok" type="submit">Começar</button>
        <button class="b b--ghost" type="button" onclick="fechar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="dlg" id="dlgDel">
  <div class="bx2">
    <h2>Excluir marca</h2>
    <p style="color:var(--i50);font-size:14px;line-height:1.55;margin:0 0 22px">
      Vou apagar <b id="delNome" style="color:var(--ink)"></b> e junto os 16 passos, as 135 tarefas,
      os exercícios e tudo que você preencheu nela. <b style="color:var(--ink)">Não tem como desfazer.</b>
    </p>
    <div class="er" id="errDel"></div>
    <div style="display:flex;gap:10px">
      <button class="b b--ghost" onclick="fecharApagar()">Cancelar</button>
      <button class="b" id="btnDel" style="background:var(--pink);color:var(--ink);margin-left:auto"
        onclick="apagar()">Excluir para sempre</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/estrategia/config.js"></script>
<script src="/estrategia/nave.js"></script>
<script>
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dlg = el('dlg');
function abrir(){ dlg.classList.add('on'); document.querySelector('[name=cliente]').focus(); }
function fechar(){ dlg.classList.remove('on'); el('err').textContent = ''; }
dlg.addEventListener('click', e => { if (e.target === dlg) fechar(); });
el('dlgDel').addEventListener('click', e => { if (e.target === el('dlgDel')) fecharApagar(); });

let alvoDel = null;
function pedirApagar(id, nome){
  alvoDel = id;
  el('delNome').textContent = nome;
  el('errDel').textContent = '';
  el('dlgDel').classList.add('on');
}
function fecharApagar(){ el('dlgDel').classList.remove('on'); alvoDel = null; }
async function apagar(){
  if (!alvoDel) return;
  const btn = el('btnDel');
  btn.disabled = true; el('errDel').textContent = 'Apagando…';
  try {
    await NAVE.post('marca_del', { id: alvoDel });
    fecharApagar(); btn.disabled = false;
    await carregar();
  } catch (e) { el('errDel').textContent = e.message || 'Não consegui apagar.'; btn.disabled = false; }
}

async function carregar(){
  const ms = await NAVE.get('projetos');
  if (!ms.length){
    el('lista').innerHTML = `<div class="empty"><h3>Nenhuma marca ainda</h3>
      <p>Crie a primeira. O fluxo inteiro do método aparece montado — e você começa pelo passo 1.</p></div>`;
    return;
  }
  el('lista').innerHTML = ms.map(p => {
    const nome = p.nave_clients ? p.nave_clients.name : p.name;
    const seg  = (p.nave_clients && p.nave_clients.segment) || p.name;
    const pr = p.progress || {}, total = pr.total || 16, feitas = pr.feitas || 0;
    const fluxo = Array.from({length: total}, (_, i) =>
      `<i class="${i < feitas ? 'd' : (i === feitas ? 'n' : '')}"></i>`).join('');
    return `<div class="mkw">
      <a class="mk" href="/estrategia/marca.html?p=${p.id}">
        <h3>${esc(nome)}</h3>
        <div class="seg">${esc(seg)}</div>
        <div class="now">${feitas >= total
          ? '<b>Entregue.</b>'
          : `<b>Passo ${feitas + 1} de ${total}</b><span>${esc(pr.passo || '')}</span>`}${
          pr.awaiting_approval ? '<span>· aguardando o cliente</span>' : ''}</div>
        <div class="fluxo">${fluxo}</div>
      </a>
      <button class="apagar" title="Excluir marca"
        onclick="pedirApagar('${p.id}', '${esc(nome).replace(/'/g, "\\'")}')">✕</button>
    </div>`;
  }).join('');
}

el('form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target), btn = el('ok'), err = el('err');
  btn.disabled = true; err.textContent = 'Montando os 16 passos…';
  try {
    const cliente = await NAVE.post('cliente', { name: f.get('cliente'),
      segment: f.get('segmento') || null, email: f.get('email') || null,
      brand_exists: f.get('existe') === 'sim' });
    const r = await NAVE.post('projeto', { client_id: cliente.id, name: f.get('projeto'),
      started_at: f.get('inicio') || null, target_end: f.get('fim') || null });
    location.href = '/estrategia/marca.html?p=' + r.project.id;
  } catch (ex) { err.textContent = ex.message || 'Não consegui criar.'; btn.disabled = false; }
});

(async function(){
  if (!await NAVE.guard()) return;
  try { await carregar(); }
  catch (e) { el('lista').innerHTML = `<div class="empty"><h3>Não consegui carregar</h3><p>${esc(e.message)}</p></div>`; }
})();
</script>
</body>
</html>
