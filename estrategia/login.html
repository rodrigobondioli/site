<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Estratégia de Marca</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/shared.css">
<style>
:root{
  --bnd-ink:#101010; --bnd-bg:#f1f1f1; --bnd-white:#fff; --bnd-lime:#e7f99a;
  --bnd-body:"Vinila","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --bnd-display:"Vinila","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --bnd-radius:16px; --bnd-rule-soft:1px dashed rgba(16,16,16,.5);
  --ink-50:rgba(16,16,16,.5); --ink-25:rgba(16,16,16,.25); --ink-10:rgba(16,16,16,.1);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bnd-bg);
 color:var(--bnd-ink);font-family:var(--bnd-body);font-size:15px;line-height:1.35;
 -webkit-font-smoothing:antialiased;padding:24px}
.card{width:min(420px,100%);background:var(--bnd-white);border-radius:var(--bnd-radius);padding:34px 30px}
.kicker{font-size:11.2px;font-weight:600;letter-spacing:1.12px;color:var(--ink-50)}
h1{font-family:var(--bnd-display);font-weight:800;font-size:26px;margin:10px 0 8px;line-height:1.2}
p{margin:0 0 20px;color:var(--ink-50);font-size:14.5px;line-height:1.45}
label{display:block;font-size:11.2px;font-weight:600;letter-spacing:1.12px;color:var(--ink-50);margin-bottom:7px}
input{width:100%;padding:12px 14px;border:1px solid var(--ink-10);border-radius:10px;
 background:var(--bnd-bg);font:inherit;color:inherit;outline:none}
input:focus{border-color:var(--bnd-ink)}
input#codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;
 letter-spacing:8px;text-align:center;padding:14px}
button{width:100%;margin-top:14px;padding:12px 16px;border:0;border-radius:10px;
 background:var(--bnd-ink);color:var(--bnd-white);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.link{background:none;color:var(--ink-50);font-weight:400;font-size:13.5px;
 text-decoration:underline;margin-top:10px;padding:6px}
.msg{margin-top:16px;font-size:13.5px;line-height:1.45;display:none}
.msg.on{display:block}
.msg.err{color:#b00020}
.foot{margin-top:26px;padding-top:18px;border-top:var(--bnd-rule-soft);font-size:12px;color:var(--ink-25)}
.step{display:none} .step.on{display:block}
.dest{color:var(--bnd-ink);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <div class="kicker">Bondioli</div>
  <h1>Estratégia de marca</h1>

  <!-- passo 1: e-mail -->
  <div class="step on" id="s1">
    <p>Um código de acesso vai chegar no seu e-mail.</p>
    <form id="fEmail">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email" placeholder="voce@dominio.com">
      <button id="btnEmail" type="submit">Enviar código</button>
    </form>
  </div>

  <!-- passo 2: código -->
  <div class="step" id="s2">
    <p>Código enviado para <span class="dest" id="dest"></span>. Vale por 1 hora e só funciona uma vez.</p>
    <form id="fCodigo">
      <label for="codigo">Código</label>
      <input id="codigo" required inputmode="numeric" autocomplete="one-time-code"
             maxlength="8" placeholder="00000000">
      <button id="btnCodigo" type="submit">Entrar</button>
    </form>
    <button class="link" type="button" onclick="voltar()">Usar outro e-mail</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="foot">Método N.A.V.E. · uso interno</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/estrategia/config.js"></script>
<script src="/estrategia/nave.js"></script>
<script>
(function(){
  var msg = document.getElementById('msg');
  var next = new URLSearchParams(location.search).get('next') || '/estrategia/';
  var email = '';

  function say(t, cls){ msg.textContent = t; msg.className = 'msg on ' + (cls||''); }
  function limpa(){ msg.className = 'msg'; }
  function passo(n){
    document.getElementById('s1').classList.toggle('on', n===1);
    document.getElementById('s2').classList.toggle('on', n===2);
  }
  window.voltar = function(){ limpa(); passo(1); document.getElementById('email').focus(); };

  // já logado? entra direto.
  NAVE.getSession().then(function(s){ if (s) location.replace(next); });

  document.getElementById('fEmail').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('btnEmail');
    btn.disabled = true; say('Enviando…');
    email = document.getElementById('email').value.trim();
    try {
      // shouldCreateUser: o e-mail precisa já existir no Supabase.
      var r = await NAVE.sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
      if (r.error) throw r.error;
      document.getElementById('dest').textContent = email;
      limpa(); passo(2);
      document.getElementById('codigo').focus();
    } catch (err) {
      say(err.message || 'Não consegui enviar. Tente de novo.', 'err');
    } finally { btn.disabled = false; }
  });

  document.getElementById('fCodigo').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('btnCodigo');
    var codigo = document.getElementById('codigo').value.replace(/\D/g, '');
    btn.disabled = true; say('Verificando…');
    try {
      var r = await NAVE.sb.auth.verifyOtp({ email: email, token: codigo, type: 'email' });
      if (r.error) throw r.error;
      location.replace(next);
    } catch (err) {
      say(/expired|invalid/i.test(err.message||'')
            ? 'Código inválido ou expirado. Peça outro.'
            : (err.message || 'Não consegui verificar.'), 'err');
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
