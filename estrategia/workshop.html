<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop · N.A.V.E.</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/shared.css">
<style>
:root{
  --bnd-ink:#101010; --bnd-bg:#f1f1f1; --bnd-white:#fff;
  --bnd-lime:#e7f99a; --bnd-cyan:#00fff6; --bnd-pink:#ff00d7;
  --bnd-display:"Vinila","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --bnd-body:"Vinila","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --bnd-radius:16px;
  --ink-50:rgba(16,16,16,.5); --ink-25:rgba(16,16,16,.25);
  --ink-10:rgba(16,16,16,.1); --ink-5:rgba(16,16,16,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bnd-bg);color:var(--bnd-ink);font-family:var(--bnd-body);
 font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{margin:0;font-family:var(--bnd-display);font-weight:800;line-height:1.15}
button{font:inherit;font-family:var(--bnd-body);cursor:pointer}
a{color:inherit}

/* ---------- barra de topo: o painel de voo ---------- */
.bar{height:60px;display:flex;align-items:center;gap:18px;padding:0 22px;
 border-bottom:1px dashed var(--ink-25);background:var(--bnd-white)}
.bar .cli{font-size:12px;color:var(--ink-50);white-space:nowrap}
.bar .cli b{display:block;color:var(--bnd-ink);font-size:14px;font-weight:600}
.trilha{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
.tg{flex:1;min-width:10px;position:relative;display:flex;gap:2px}
.tp{flex:1;height:6px;border-radius:99px;background:var(--ink-10);min-width:2px}
.tp.feito{background:var(--bnd-ink)}
.tp.atual{background:var(--bnd-pink)}
.tg::before{content:attr(data-cod);position:absolute;top:-13px;left:0;font-size:9px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-25);letter-spacing:.3px}
.tg.aqui::before{color:var(--bnd-ink)}
.tp:hover::after{content:attr(data-nm);position:absolute;top:14px;left:0;white-space:nowrap;
 background:var(--bnd-ink);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;z-index:9}

/* cronômetro */
.crono{display:flex;align-items:center;gap:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.crono .t{font-size:26px;font-weight:700;letter-spacing:-.5px;min-width:96px;text-align:right}
.crono.estourou .t{color:var(--bnd-pink)}
.crono .prev{font-size:11px;color:var(--ink-50);line-height:1.2}
.icb{width:34px;height:34px;border-radius:99px;border:1px dashed var(--ink-25);background:none;
 display:grid;place-items:center;font-size:14px;padding:0}
.icb:hover{border-style:solid}
.icb.on{background:var(--bnd-ink);color:#fff;border-color:var(--bnd-ink)}

/* ---------- palco ---------- */
.palco{height:calc(100% - 60px);display:grid;grid-template-columns:1.15fr .85fr}
@media(max-width:1000px){.palco{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.esq{padding:40px clamp(24px,3.5vw,56px);overflow:auto;display:flex;flex-direction:column}
.dir{border-left:1px dashed var(--ink-25);padding:28px clamp(20px,2.4vw,34px);overflow:auto;background:var(--bnd-white)}

.eyebrow{font-size:12px;letter-spacing:1.1px;color:var(--ink-50);margin-bottom:14px}
.eyebrow b{color:var(--bnd-ink)}
.pergunta{font-family:var(--bnd-display);font-weight:800;font-size:clamp(26px,3.1vw,42px);
 line-height:1.12;letter-spacing:-.5px;margin:0 0 20px}
.dica{background:var(--bnd-lime);border-radius:var(--bnd-radius);padding:18px 20px;font-size:15px;
 line-height:1.45;margin-bottom:18px}
.dica .lbl{font-size:11px;letter-spacing:1.1px;color:rgba(16,16,16,.55);margin-bottom:6px}
.intro{font-size:14.5px;color:var(--ink-50);line-height:1.5;border-left:2px solid var(--ink-10);
 padding-left:14px;margin-bottom:18px}
.cresce{flex:1}

/* captura */
.dir h3{font-size:13px;letter-spacing:1.1px;color:var(--ink-50);font-family:var(--bnd-body);
 font-weight:600;margin-bottom:14px}
textarea,input[type=text],input[type=number],select{width:100%;padding:14px 16px;border:1px solid var(--ink-10);
 border-radius:12px;background:var(--bnd-bg);font:inherit;color:inherit;outline:none;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--bnd-ink)}
textarea{min-height:220px;line-height:1.5}
.pill{display:flex;align-items:center;gap:8px;background:var(--bnd-bg);border-radius:10px;
 padding:10px 12px;margin-bottom:7px;font-size:15px}
.pill .x{margin-left:auto;border:0;background:none;color:var(--ink-25);font-size:16px;padding:2px 4px}
.pill .x:hover{color:var(--bnd-pink)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.mini{font-size:12px;color:var(--ink-50)}
.tabela{width:100%;border-collapse:collapse;margin-bottom:8px}
.tabela th{font-size:11px;letter-spacing:.8px;color:var(--ink-50);text-align:left;
 font-weight:600;padding:0 6px 6px}
.tabela td{padding:0 3px 6px;vertical-align:top}
.tabela textarea{min-height:44px;padding:9px 11px;font-size:14px}
.opt{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--ink-25);border-radius:99px;
 padding:8px 14px;margin:0 6px 7px 0;font-size:14px;background:none}
.opt.on{background:var(--bnd-ink);color:#fff;border-color:var(--bnd-ink)}

/* rodapé */
.rodape{display:flex;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--bnd-ink);color:#fff;border:0;
 border-radius:99px;padding:13px 24px;font-weight:600;font-size:15px}
.btn--line{background:none;color:var(--bnd-ink);border:1px dashed var(--ink-25)}
.btn--line:hover{border-style:solid}
.btn:disabled{opacity:.3;cursor:default}
.salvo{font-size:12px;color:var(--ink-50);margin-left:auto}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-25)}

/* agenda / fim */
.tela{position:absolute;inset:60px 0 0;background:var(--bnd-bg);overflow:auto;
 padding:44px clamp(24px,5vw,80px);display:none}
.tela.on{display:block}
.wrap{max-width:840px}
.lin{display:flex;align-items:center;gap:14px;background:var(--bnd-white);border-radius:14px;
 padding:16px 20px;margin-bottom:8px;width:100%;text-align:left;border:0;font:inherit}
button.lin{cursor:pointer}
.lin.fora{opacity:.4}
.mk{width:20px;height:20px;border-radius:6px;border:1px dashed var(--ink-25);flex:0 0 20px;
 display:grid;place-items:center;font-size:12px;color:transparent}
.lin:not(.fora) .mk{background:var(--bnd-ink);border-color:var(--bnd-ink);color:#fff}
.aviso{background:var(--bnd-lime);border-radius:var(--bnd-radius);padding:16px 20px;
 font-size:14.5px;line-height:1.45;margin-bottom:20px}
.lin .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-50);min-width:34px}
.lin .nm{flex:1;font-weight:600}
.lin .ax{font-size:11.5px;color:var(--ink-50)}
.lin .dur{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink-50)}
.tag{font-size:11px;letter-spacing:.6px;background:var(--bnd-lime);border-radius:99px;padding:4px 10px}
.grande{font-size:clamp(30px,4vw,46px);letter-spacing:-1px;margin-bottom:10px}
.sub{color:var(--ink-50);font-size:16px;line-height:1.5;margin-bottom:28px;max-width:60ch}
.sep{height:1px;border-top:1px dashed var(--ink-25);margin:28px 0}

/* modo apresentação: some tudo que é meu, fica o que é do cliente */
body.apresentando .dica,
body.apresentando .intro,
body.apresentando .bar .cli,
body.apresentando .eyebrow,
body.apresentando .salvo,
body.apresentando .mini{display:none !important}
body.apresentando .dir h3{opacity:0}
body.apresentando .pergunta{font-size:clamp(34px,4.4vw,58px)}
body.apresentando .palco{grid-template-columns:1fr .7fr}
</style>
</head>
<body>

<div class="bar">
  <div class="cli"><b id="bCliente">…</b><span id="bFase"></span></div>
  <div class="trilha" id="trilha"></div>
  <div class="crono" id="crono">
    <div class="prev" id="cPrev"></div>
    <div class="t" id="cTempo">00:00</div>
  </div>
  <button class="icb" id="bPausa" title="Pausar (espaço)">❚❚</button>
  <button class="icb" id="bApres" title="Modo apresentação — esconde as minhas notas (P)">👁</button>
  <button class="icb" id="bAgenda" title="Agenda da sessão (Esc)">☰</button>
</div>

<!-- palco -->
<div class="palco" id="palco" style="display:none">
  <div class="esq">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="pergunta" id="pergunta"></h1>
    <div class="intro" id="intro"></div>
    <div class="dica" id="dica"></div>
    <div class="cresce"></div>
    <div class="rodape">
      <button class="btn btn--line" id="bAnt">← anterior</button>
      <button class="btn" id="bProx">próxima <span class="kbd" style="color:rgba(255,255,255,.5)">⌘↵</span></button>
      <span class="salvo" id="salvo"></span>
    </div>
  </div>
  <div class="dir">
    <h3>captura</h3>
    <div id="campo"></div>
    <div class="rodape" style="margin-top:18px">
      <button class="btn btn--line" id="bCopiar">copiar para o Miro</button>
    </div>
  </div>
</div>

<!-- agenda -->
<div class="tela on" id="telaAgenda">
  <div class="wrap">
    <div class="eyebrow" id="aCliente">…</div>
    <h1 class="grande">Agenda da sessão</h1>
    <p class="sub" id="aResumo"></p>
    <div id="aLista"></div>
    <div class="rodape">
      <button class="btn" id="bComecar">começar o workshop</button>
      <a class="btn btn--line" id="aVoltar" href="#">voltar ao projeto</a>
    </div>
    <div class="sep"></div>
    <p class="mini">Atalhos: <span class="kbd">⌘↵</span> avança · <span class="kbd">espaço</span> pausa o cronômetro ·
    <span class="kbd">P</span> modo apresentação · <span class="kbd">Esc</span> volta para a agenda.
    Tudo salva sozinho — não existe botão de salvar aqui de propósito.</p>
  </div>
</div>

<!-- fim -->
<div class="tela" id="telaFim">
  <div class="wrap">
    <div class="eyebrow">sessão encerrada</div>
    <h1 class="grande">Fechou.</h1>
    <p class="sub" id="fResumo"></p>
    <div id="fLista"></div>
    <div class="rodape">
      <button class="btn" id="bExportar">exportar tudo em markdown</button>
      <a class="btn btn--line" id="fVoltar" href="#">voltar ao projeto</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/estrategia/config.js"></script>
<script src="/estrategia/nave.js"></script>
<script>
const PROJ = new URLSearchParams(location.search).get('p');
const AXIS = {N:'negócio', A:'audiência', V:'valor', E:'estória'};

let D=null, CAT=null, FILA=[], i=0, PE={}, VAL={};
let INSTS=[], CAMPOS={}, DENTRO=new Set();
let t0=null, acc=0, rodando=false, tick=null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = ms => {
  const s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
};

// ---------------------------------------------------------------- boot
(async function(){
  if (!await NAVE.guard()) return;
  if (!PROJ) { location.replace('/estrategia/'); return; }
  const [proj, cat] = await Promise.all([ NAVE.get('projeto',{id:PROJ}), NAVE.catalogo() ]);
  D = proj; CAT = cat;

  $('aVoltar').href = $('fVoltar').href = '/estrategia/projeto.html?p=' + PROJ;
  $('bCliente').textContent = proj.client ? proj.client.name : 'Projeto';
  $('aCliente').textContent = (proj.client ? proj.client.name + ' · ' : '') + proj.project.name;

  // campos por instrumento
  const campos = {};
  cat.fields.forEach(f => (campos[f.exercise_id] ||= []).push(f));
  Object.values(campos).forEach(a => a.sort((x,y)=>x.ord-y.ord));

  // a fila é a seleção do projeto; sem seleção, os mínimos dos 4 eixos
  const escolhidos = proj.selection.filter(s => s.selected).map(s => s.exercise_id);
  const doWorkshop = e => ['N','A','V','E'].includes(e.axis) && e.phase_id === 'F3';
  let insts = escolhidos.length
    ? cat.exercises.filter(e => escolhidos.includes(e.id))
    : cat.exercises.filter(e => doWorkshop(e) && e.minimum);

  const ordem = {N:0, A:1, V:2, E:3};
  insts.sort((a,b) => (ordem[a.axis] ?? 9) - (ordem[b.axis] ?? 9)
    || a.id.localeCompare(b.id, 'pt', {numeric:true}));

  proj.selection.forEach(s => PE[s.exercise_id] = s.id);
  const porPe = {};
  proj.responses.forEach(r => (porPe[r.project_exercise_id] ||= {})[r.field_key] = r.value);
  proj.selection.forEach(s => { if (porPe[s.id]) VAL[s.exercise_id] = porPe[s.id]; });

  INSTS = insts; CAMPOS = campos;
  insts.forEach(e => DENTRO.add(e.id));
  agenda(escolhidos.length > 0);
})();

// A sessão não é o projeto inteiro. O método roda em blocos — ligue e desligue
// aqui o que entra NESTA sessão, e o tempo vai somando ao lado.
function agenda(temSelecao){
  $('aLista').innerHTML = INSTS.map(e => `
    <button class="lin ${DENTRO.has(e.id)?'':'fora'}" id="lin_${e.id}" onclick="alterna('${e.id}')">
      <span class="mk">✓</span>
      <span class="cod">${e.id}</span>
      <span class="nm">${esc(e.name)}<span class="ax" style="display:block">eixo ${AXIS[e.axis]||'—'} · ${(CAMPOS[e.id]||[]).length} perguntas</span></span>
      ${e.minimum ? '<span class="tag">mínimo viável</span>' : ''}
      <span class="dur">${e.duration_min||'—'} min</span>
    </button>`).join('') || '<div class="lin">Nada disponível.</div>';
  $('aResumo').dataset.tem = temSelecao ? '1' : '';
  soma();
}

function alterna(id){
  DENTRO.has(id) ? DENTRO.delete(id) : DENTRO.add(id);
  $('lin_'+id).classList.toggle('fora', !DENTRO.has(id));
  soma();
}
window.alterna = alterna;

function soma(){
  const dentro = INSTS.filter(e => DENTRO.has(e.id));
  const min = dentro.reduce((s,e)=> s + (e.duration_min||0), 0);
  const perg = dentro.reduce((s,e)=> s + (CAMPOS[e.id]||[]).length, 0);
  const h = Math.floor(min/60), m = min%60;
  const tempo = (h ? h+'h' : '') + (m ? (h?' ':'')+m+'min' : (h?'':'0min'));

  const origem = $('aResumo').dataset.tem
    ? 'Esta é a seleção que você fez para este cliente.'
    : 'Você ainda não selecionou os instrumentos deste projeto, então liguei o <b>mínimo viável dos quatro eixos</b>.';

  let alerta = '';
  if (min > 240) alerta = `<div class="aviso"><b>${tempo} não cabe numa sessão.</b>
    Uma imersão costuma render 3 a 4 horas antes de todo mundo cansar — e o próprio método manda
    <b>selecionar</b>, não fazer tudo. Desligue instrumentos aqui e rode o resto em outro bloco.
    O que ficar de fora continua no projeto, esperando.</div>`;
  else if (min > 0 && min <= 240) alerta = `<div class="aviso"><b>${tempo} de sessão.</b>
    Cabe num bloco. O que você desligar aqui continua no projeto para outra sessão.</div>`;

  $('aResumo').innerHTML = origem +
    ` <b>${dentro.length} instrumentos · ${perg} perguntas · ${tempo}.</b>` + alerta;
  $('bComecar').disabled = dentro.length === 0;
}

function montaFila(){
  FILA = [];
  INSTS.filter(e => DENTRO.has(e.id)).forEach(e => (CAMPOS[e.id]||[]).forEach((f, idx, arr) => {
    FILA.push({ ex:e, campo:f, idx, total:arr.length,
                dur: Math.max(2, Math.round((e.duration_min || 20) / arr.length)) });
  }));
  // trilha agrupada por instrumento: 14 grupos legíveis, não 79 tracinhos
  const grupos = [];
  FILA.forEach((p,n) => {
    let g = grupos[grupos.length-1];
    if (!g || g.cod !== p.ex.id) { g = {cod:p.ex.id, itens:[]}; grupos.push(g); }
    g.itens.push(n);
  });
  $('trilha').innerHTML = grupos.map(g =>
    `<div class="tg" data-cod="${g.cod}">` +
    g.itens.map(n => `<div class="tp" data-n="${n}" title="${esc(FILA[n].campo.label)}" onclick="irPara(${n})"></div>`).join('') +
    `</div>`).join('');
}

// ---------------------------------------------------------------- cronômetro
function zeraCrono(min){
  acc = 0; t0 = Date.now(); rodando = true;
  $('cPrev').innerHTML = 'previsto<br>' + min + ' min';
  $('crono').dataset.min = min;
  desenhaCrono();
}
function desenhaCrono(){
  const ms = acc + (rodando ? Date.now()-t0 : 0);
  $('cTempo').textContent = mmss(ms);
  const lim = (+$('crono').dataset.min || 0) * 60000;
  $('crono').classList.toggle('estourou', lim > 0 && ms > lim);
}
tick = setInterval(desenhaCrono, 500);
function pausa(){
  if (rodando) { acc += Date.now()-t0; rodando=false; } else { t0=Date.now(); rodando=true; }
  $('bPausa').classList.toggle('on', !rodando);
  $('bPausa').textContent = rodando ? '❚❚' : '▶';
}

// ---------------------------------------------------------------- passo
function irPara(n){
  if (n < 0 || n >= FILA.length) return;
  salvar();
  i = n;
  render();
}
window.irPara = irPara;

function render(){
  const p = FILA[i];
  $('telaAgenda').classList.remove('on');
  $('telaFim').classList.remove('on');
  $('palco').style.display = 'grid';

  $('bFase').textContent = 'imersão · eixo ' + (AXIS[p.ex.axis] || '—');
  $('eyebrow').innerHTML = `<b>${p.ex.id} · ${esc(p.ex.name)}</b> &nbsp;·&nbsp; ` +
    `pergunta ${p.idx+1} de ${p.total} &nbsp;·&nbsp; ${i+1} de ${FILA.length} na sessão`;
  $('pergunta').textContent = p.campo.label;

  // o enunciado do instrumento só na primeira pergunta dele
  $('intro').style.display = (p.idx === 0 && p.ex.intro) ? 'block' : 'none';
  $('intro').textContent = p.ex.intro || '';

  if (p.campo.hint) { $('dica').style.display='block';
    $('dica').innerHTML = '<div class="lbl">como conduzir</div>' + esc(p.campo.hint); }
  else $('dica').style.display = 'none';

  document.querySelectorAll('.tp').forEach(el => {
    const n = +el.dataset.n;
    el.classList.toggle('feito', n < i);
    el.classList.toggle('atual', n === i);
  });
  document.querySelectorAll('.tg').forEach(g =>
    g.classList.toggle('aqui', !!g.querySelector('.tp.atual')));

  $('bAnt').disabled = i === 0;
  $('bProx').innerHTML = (i === FILA.length-1)
    ? 'encerrar sessão' : 'próxima <span class="kbd" style="color:rgba(255,255,255,.5)">⌘↵</span>';

  renderCampo(p);
  zeraCrono(p.dur);
}

// ---------------------------------------------------------------- captura
function valor(p){ return (VAL[p.ex.id] || {})[p.campo.key]; }

function renderCampo(p){
  const f = p.campo, v = valor(p), el = $('campo');
  const cols = f.config?.columns || [];
  const opts = f.config?.options || [];

  if (f.type === 'list') {
    const itens = Array.isArray(v) ? v : [];
    el.innerHTML = itens.map((x,n)=>`<div class="pill"><span>${esc(x)}</span>
      <button class="x" onclick="tiraItem(${n})">×</button></div>`).join('') +
      `<div class="addrow"><input type="text" id="novo" placeholder="escreva e dê enter"></div>
       <div class="mini" style="margin-top:8px">um post-it por linha</div>`;
    $('novo').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const a = Array.isArray(valor(p)) ? [...valor(p)] : [];
        a.push(e.target.value.trim()); grava(a); renderCampo(p); $('novo').focus();
      }
    });
    $('novo').focus();
    window.tiraItem = n => { const a=[...valor(p)]; a.splice(n,1); grava(a); renderCampo(p); };
  }
  else if (f.type === 'table') {
    const linhas = Array.isArray(v) && v.length ? v : [cols.map(()=> '')];
    el.innerHTML = `<table class="tabela"><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>` +
      linhas.map((r,ri)=>`<tr>${cols.map((_,ci)=>
        `<td><textarea data-r="${ri}" data-c="${ci}">${esc(r[ci]||'')}</textarea></td>`).join('')}</tr>`).join('') +
      `</table><button class="btn btn--line" onclick="maisLinha()">+ linha</button>`;
    el.querySelectorAll('textarea').forEach(t => t.addEventListener('input', () => {
      const m = linhas.map(r=>[...r]);
      el.querySelectorAll('textarea').forEach(x => m[+x.dataset.r][+x.dataset.c] = x.value);
      grava(m);
    }));
    window.maisLinha = () => { grava([...linhas, cols.map(()=> '')]); renderCampo(p); };
  }
  else if (f.type === 'select' || f.type === 'multiselect') {
    const sel = f.type === 'multiselect' ? (Array.isArray(v)?v:[]) : [v];
    el.innerHTML = opts.map(o=>`<button class="opt ${sel.includes(o)?'on':''}"
      onclick="marcaOpt('${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('');
    window.marcaOpt = o => {
      if (f.type === 'multiselect') {
        const a = Array.isArray(valor(p)) ? [...valor(p)] : [];
        const k = a.indexOf(o); k>=0 ? a.splice(k,1) : a.push(o); grava(a);
      } else grava(valor(p) === o ? null : o);
      renderCampo(p);
    };
  }
  else {
    const multi = f.type === 'longtext';
    el.innerHTML = multi
      ? `<textarea id="txt" placeholder="anote aqui — cru mesmo, organiza depois"></textarea>`
      : `<input type="text" id="txt">`;
    $('txt').value = v == null ? '' : v;
    $('txt').addEventListener('input', e => grava(e.target.value));
    $('txt').focus();
  }
}

// ---------------------------------------------------------------- gravação
let fila = null, timer = null;
function grava(v){
  const p = FILA[i];
  (VAL[p.ex.id] ||= {})[p.campo.key] = v;
  fila = p;
  $('salvo').textContent = '…';
  clearTimeout(timer);
  timer = setTimeout(salvar, 900);
}
async function salvar(){
  if (!fila) return;
  const p = fila; fila = null; clearTimeout(timer);
  try {
    let pe = PE[p.ex.id];
    if (!pe) {
      const r = await NAVE.post('selecao', { project_id: PROJ,
        items: [{ exercise_id: p.ex.id, selected: true, rationale: 'rodado no workshop' }] });
      pe = r.items[0].id; PE[p.ex.id] = pe;
    }
    await NAVE.post('resposta', { project_exercise_id: pe, status:'em_andamento',
      values: { [p.campo.key]: VAL[p.ex.id][p.campo.key] } });
    $('salvo').textContent = 'salvo ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  } catch (e) {
    $('salvo').textContent = 'sem conexão — guardado aqui';
    try { localStorage.setItem('nave:ws:'+PROJ, JSON.stringify(VAL)); } catch {}
  }
}

// ---------------------------------------------------------------- ações
$('bComecar').onclick = () => { montaFila(); if (FILA.length) { i = 0; render(); } };
$('bAnt').onclick = () => irPara(i-1);
$('bProx').onclick = () => {
  if (i === FILA.length-1) encerrar(); else irPara(i+1);
};
$('bPausa').onclick = pausa;
$('bAgenda').onclick = () => { salvar(); $('palco').style.display='none';
  $('telaFim').classList.remove('on'); $('telaAgenda').classList.add('on'); };
$('bApres').onclick = () => {
  document.body.classList.toggle('apresentando');
  $('bApres').classList.toggle('on', document.body.classList.contains('apresentando'));
};
$('bCopiar').onclick = () => {
  navigator.clipboard.writeText(textoDoPasso(FILA[i]));
  $('bCopiar').textContent = 'copiado'; setTimeout(()=>$('bCopiar').textContent='copiar para o Miro', 1400);
};

function textoDoPasso(p){
  const v = valor(p);
  if (Array.isArray(v) && Array.isArray(v[0])) return v.map(r=>r.join('\t')).join('\n');
  if (Array.isArray(v)) return v.join('\n');
  return v == null ? '' : String(v);
}

function encerrar(){
  salvar();
  rodando = false;
  $('palco').style.display = 'none';
  $('telaFim').classList.add('on');
  const feitos = {};
  FILA.forEach(p => { const v = valor(p);
    if (v != null && String(v).length && !(Array.isArray(v) && !v.length))
      (feitos[p.ex.id] ||= {ex:p.ex, n:0}).n++; });
  const lista = Object.values(feitos);
  $('fResumo').innerHTML = `<b>${lista.length} instrumentos com resposta.</b> ` +
    `Tudo já está no projeto. O próximo passo do método é a descompressão: passar a limpo enquanto está fresco.`;
  $('fLista').innerHTML = lista.map(x=>`
    <div class="lin"><span class="cod">${x.ex.id}</span>
      <span class="nm">${esc(x.ex.name)}</span>
      <span class="dur">${x.n} respostas</span></div>`).join('');
}

$('bExportar').onclick = () => {
  let md = `# ${D.client ? D.client.name : ''} · workshop\n\n`;
  let atual = null;
  FILA.forEach(p => {
    const v = valor(p);
    if (v == null || !String(v).length || (Array.isArray(v) && !v.length)) return;
    if (atual !== p.ex.id) { atual = p.ex.id; md += `\n## ${p.ex.id} · ${p.ex.name}\n\n`; }
    md += `**${p.campo.label}**\n\n${textoDoPasso(p)}\n\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], {type:'text/markdown'}));
  a.download = 'workshop.md'; a.click();
};

// ---------------------------------------------------------------- teclado
document.addEventListener('keydown', e => {
  const digitando = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); $('bProx').click(); }
  else if (e.key === 'Escape') $('bAgenda').click();
  else if (!digitando && e.key === ' ') { e.preventDefault(); pausa(); }
  else if (!digitando && e.key.toLowerCase() === 'p') $('bApres').click();
});
window.addEventListener('beforeunload', salvar);
</script>
