<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop · N.A.V.E.</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/shared.css">
<link rel="stylesheet" href="/estrategia/ui.css">
<style>
body{overflow-x:hidden}
/* ---------- linha do tempo ---------- */
.tl{display:flex;gap:3px;margin:18px 0 40px}
.tl i{flex:1;height:5px;border-radius:99px;background:var(--ink-10);position:relative}
.tl i.ok{background:var(--bnd-ink)}
.tl i.aqui{background:var(--bnd-pink)}
.tl i[data-l]::after{content:attr(data-l);position:absolute;top:-17px;left:0;font-size:9.5px;
 letter-spacing:.6px;color:var(--ink-25);white-space:nowrap}
.tl i.aqui[data-l]::after{color:var(--bnd-ink)}

/* ---------- pilares e cards ---------- */
.pilar{margin:0 0 40px}
.pilar h2{font-family:var(--bnd-display);font-weight:800;font-size:20px;letter-spacing:-.3px;margin:0 0 4px}
.pilar p{font-size:13.5px;color:var(--ink-50);margin:0 0 16px;max-width:70ch;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:var(--bnd-white);border:0;border-radius:var(--bnd-radius);padding:20px;
 text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:132px}
.card:hover{outline:1px solid var(--ink-25)}
.card.ess{background:var(--bnd-lime)}
.card .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
 letter-spacing:.4px;color:var(--ink-50)}
.card .nm{font-family:var(--bnd-display);font-weight:800;font-size:16.5px;line-height:1.2;flex:1}
.card .pe{font-size:12px;color:var(--ink-50);display:flex;gap:10px;align-items:center}
.card .feito{color:var(--bnd-ink);font-weight:600}

/* ---------- exercício aberto ---------- */
.aberto{position:fixed;inset:0;background:var(--bnd-bg);z-index:60;display:none;
 grid-template-rows:auto 1fr}
.aberto.on{display:grid}
.barra{display:flex;align-items:center;gap:18px;padding:14px 22px;background:var(--bnd-white);
 border-bottom:var(--bnd-rule-soft);flex-wrap:wrap}
.barra .tit{font-family:var(--bnd-display);font-weight:800;font-size:17px;flex:1;min-width:180px}
.barra .tit span{display:block;font-family:var(--bnd-body);font-weight:400;font-size:12px;color:var(--ink-50)}
.crono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:24px;font-weight:700;
 letter-spacing:-.5px;min-width:88px;text-align:right}
.crono.estourou{color:var(--bnd-pink)}
.prev{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-50);line-height:1.2}
.quadro{position:relative}
.quadro .dw-palco{position:absolute;inset:0}
.perg{position:absolute;left:16px;top:16px;z-index:5;background:var(--bnd-white);
 border-radius:12px;padding:16px 18px;max-width:min(400px,42vw);max-height:calc(100% - 32px);overflow:auto}
.perg ol{margin:0;padding-left:18px}
.perg li{font-size:13.5px;line-height:1.4;padding:4px 0;color:rgba(16,16,16,.8)}
.perg .dica{margin-top:12px;padding-top:12px;border-top:var(--bnd-rule-soft);font-size:12.5px;
 color:var(--ink-50);line-height:1.45}
.perg .fecha{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--ink-25);font-size:16px}
.mostrar{position:absolute;left:16px;top:16px;z-index:5}
.dw-palco{height:100%;background:var(--bnd-white)}
.dw-carregando,.dw-falhou{padding:26px;font-size:14px;color:var(--ink-50);line-height:1.5}
.dw-falhou b{display:block;color:var(--bnd-ink);margin-bottom:6px}
.dw-link{width:100%;margin-top:12px;padding:11px 13px;border:1px solid var(--ink-10);
 border-radius:10px;background:var(--bnd-bg);font:inherit;outline:none}
.mini{font-size:12px;color:var(--ink-50)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bnd-ink);
 color:var(--bnd-white);padding:11px 18px;border-radius:99px;font-size:13.5px;opacity:0;
 pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/shared/logo.svg" alt="Bondioli" onerror="this.outerHTML='<b style=&quot;font-family:var(--bnd-display);font-weight:800;font-size:16px&quot;>BOND</b>'">
      <span>estratégia</span>
    </div>
    <div class="navsec">Trabalho</div>
    <a class="navbtn" href="/estrategia/">Projetos</a>
    <a class="navbtn" id="lkProj" href="#">Este projeto</a>
    <a class="navbtn on" href="#">Workshop</a>
    <div class="navsec">Consulta</div>
    <a class="navbtn" href="/estrategia/metodo/PLAYBOOK-NAVE.html">Playbook N.A.V.E.</a>
    <div class="navsec">Conta</div>
    <button class="navbtn" onclick="NAVE.logout()">Sair</button>
  </aside>

  <main class="main">
    <div class="kicker" id="cliente">…</div>
    <h1>Workshop</h1>
    <div class="tl" id="tl"></div>
    <div id="pilares"></div>
  </main>
</div>

<div class="aberto" id="aberto">
  <div class="barra">
    <button class="btn btn--line" onclick="fechar()">← voltar</button>
    <div class="tit" id="exTit">&nbsp;<span id="exSub"></span></div>
    <div class="prev" id="exPrev"></div>
    <div class="crono" id="exCrono">00:00</div>
    <button class="btn btn--line" onclick="pausa()" id="btPausa">pausar</button>
    <button class="btn" onclick="salvar(true)">salvar</button>
  </div>
  <div class="quadro" id="quadro"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/estrategia/config.js"></script>
<script src="/estrategia/nave.js"></script>
<script src="/estrategia/desenho.js"></script>
<script>
const PROJ = new URLSearchParams(location.search).get('p');
const PILAR = [
  ['N','Negócio','Entender a configuração do negócio, os objetivos e as vantagens. Entender o negócio, jamais desenvolvê-lo.'],
  ['A','Audiência','Quem a marca atende, quem ela quer atender e o que essas pessoas precisam.'],
  ['V','Valor','A proposta de valor da marca e a dos players que prometem a mesma coisa.'],
  ['E','Estória','A verdade da marca: origem, crenças, propósito e personalidade.'],
];
let D=null, CAT=null, CAMPOS={}, PE={}, VAL={}, atual=null, quadro=null;
let t0=null, acc=0, rodando=false;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),3000); }
const mmss = ms => { const s=Math.max(0,Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

// ------------------------------------------------------------------ boot
(async function(){
  if (!await NAVE.guard()) return;
  if (!PROJ) { location.replace('/estrategia/'); return; }
  const [proj, cat] = await Promise.all([ NAVE.get('projeto',{id:PROJ}), NAVE.catalogo() ]);
  D = proj; CAT = cat;
  cat.fields.forEach(f => (CAMPOS[f.exercise_id] ||= []).push(f));
  Object.values(CAMPOS).forEach(a => a.sort((x,y)=>x.ord-y.ord));
  proj.selection.forEach(s => PE[s.exercise_id] = s.id);
  const porPe = {};
  proj.responses.forEach(r => (porPe[r.project_exercise_id] ||= {})[r.field_key] = r.value);
  proj.selection.forEach(s => { if (porPe[s.id]) VAL[s.exercise_id] = porPe[s.id]; });

  $('cliente').textContent = (proj.client ? proj.client.name + ' · ' : '') + proj.project.name;
  $('lkProj').href = '/estrategia/projeto.html?p=' + PROJ;
  linhaDoTempo();
  grade();
})();

function linhaDoTempo(){
  const fases = D.phases.map(pp => ({pp, f: pp.nave_phases||{}}))
                        .sort((a,b)=>(a.f.ord??0)-(b.f.ord??0));
  const atualF = fases.find(x => x.pp.status !== 'concluido') || fases[fases.length-1];
  let macro = null;
  $('tl').innerHTML = fases.map(x => {
    const novo = x.f.macro !== macro; if (novo) macro = x.f.macro;
    const l = novo ? ` data-l="${(x.f.macro||'').toLowerCase()}"` : '';
    return `<i class="${x.pp.status==='concluido'?'ok':''} ${x===atualF?'aqui':''}"${l}
      title="${esc(x.f.id+' · '+x.f.name)}"></i>`;
  }).join('');
}

// ------------------------------------------------------------------ grade
function grade(){
  $('pilares').innerHTML = PILAR.map(([eixo, nome, desc]) => {
    const lista = CAT.exercises
      .filter(e => e.axis === eixo && e.phase_id === 'F3')
      .sort((a,b)=>a.id.localeCompare(b.id,'pt',{numeric:true}));
    if (!lista.length) return '';
    return `<section class="pilar">
      <h2>${nome}</h2><p>${desc}</p>
      <div class="cards">${lista.map(cardHtml).join('')}</div>
    </section>`;
  }).join('');
}

function cardHtml(e){
  const resp = VAL[e.id] || {};
  const feito = Object.values(resp).some(v => v != null && (Array.isArray(v) ? v.length : String(v).length));
  const ess = e.tier === 'espinha' || (!e.tier && e.minimum);
  return `<button class="card ${ess?'ess':''}" onclick="abrir('${e.id}')">
    <span class="cod">${e.id}${ess ? ' · essencial' : ''}</span>
    <span class="nm">${esc(e.name)}</span>
    <span class="pe">
      <span>${e.duration_min || '—'} min</span>
      <span>${(CAMPOS[e.id]||[]).length} perguntas</span>
      ${feito ? '<span class="feito">✓ preenchido</span>' : ''}
    </span></button>`;
}

// ------------------------------------------------------------------ abrir
async function abrir(code){
  const e = CAT.exercises.find(x => x.id === code); if (!e) return;
  atual = e;
  $('aberto').classList.add('on');
  $('exTit').innerHTML = esc(e.name) + `<span>${e.id} · ${(CAMPOS[code]||[]).length} perguntas</span>`;
  $('exPrev').innerHTML = 'previsto<br>' + (e.duration_min || '—') + ' min';
  zera(e.duration_min || 0);

  const campos = CAMPOS[code] || [];
  const dicas = [...new Set(campos.map(f => f.hint).filter(Boolean))];
  $('quadro').innerHTML = `
    <div class="perg" id="perg">
      <button class="fecha" onclick="document.getElementById('perg').style.display='none';document.getElementById('mostrar').style.display='block'">×</button>
      ${e.intro ? `<p class="mini" style="margin:0 0 10px">${esc(e.intro)}</p>` : ''}
      <ol>${campos.map(f => `<li>${esc(f.label)}</li>`).join('')}</ol>
      ${dicas.length ? `<div class="dica">${dicas.map(esc).join('<br>')}</div>` : ''}
    </div>
    <button class="btn btn--line mostrar" id="mostrar" style="display:none"
      onclick="document.getElementById('perg').style.display='block';this.style.display='none'">perguntas</button>
    <div id="palco" style="height:100%"></div>`;

  const salvo = (VAL[code] || {}).quadro || null;
  quadro = await NAVE_DESENHO.montar($('palco'), salvo, val => {
    (VAL[code] ||= {}).quadro = val;
    salvar(false);
  });
}

function fechar(){
  salvar(false);
  if (quadro) { quadro.destruir(); quadro = null; }
  rodando = false;
  $('aberto').classList.remove('on');
  grade();
}

// ------------------------------------------------------------------ tempo
function zera(min){ acc=0; t0=Date.now(); rodando=true; $('exCrono').dataset.min=min; pinta(); }
function pinta(){
  const ms = acc + (rodando ? Date.now()-t0 : 0);
  $('exCrono').textContent = mmss(ms);
  const lim = (+$('exCrono').dataset.min||0)*60000;
  $('exCrono').classList.toggle('estourou', lim>0 && ms>lim);
}
setInterval(() => { if ($('aberto').classList.contains('on')) pinta(); }, 500);
function pausa(){
  if (rodando){ acc += Date.now()-t0; rodando=false; $('btPausa').textContent='retomar'; }
  else { t0=Date.now(); rodando=true; $('btPausa').textContent='pausar'; }
}

// ------------------------------------------------------------------ salvar
let tsave=null, salvando=false;
function salvar(agora){
  clearTimeout(tsave);
  if (agora) return gravar();
  tsave = setTimeout(gravar, 1200);
}
async function gravar(){
  if (!atual || salvando) return;
  const code = atual.id, val = (VAL[code]||{}).quadro;
  if (val === undefined) return;
  salvando = true;
  try {
    let pe = PE[code];
    if (!pe) {
      const r = await NAVE.post('selecao', { project_id: PROJ,
        items:[{exercise_id: code, selected:true, rationale:'rodado no workshop'}] });
      pe = r.items[0].id; PE[code] = pe;
    }
    await NAVE.post('resposta', { project_exercise_id: pe, status:'em_andamento', values:{ quadro: val } });
    toast('Salvo.');
  } catch (e) { toast('Sem conexão — o desenho continua aqui.'); }
  finally { salvando = false; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('aberto').classList.contains('on')) fechar();
});
window.addEventListener('beforeunload', gravar);
</script>
</body>
</html>
