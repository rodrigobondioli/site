<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto · Estratégia de Marca</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/shared.css">
<link rel="stylesheet" href="/estrategia/ui.css">
<style>
/* Menos superfícies. Fundo cinza, separador tracejado, nada de cartão sobre cartão. */
.topo{margin-bottom:34px}
.crumb{font-size:12.5px;color:var(--ink-50);margin-bottom:8px}
.crumb a{text-decoration:none} .crumb a:hover{text-decoration:underline}
.linha{font-size:14px;color:var(--ink-50);margin-top:10px}
.linha b{color:var(--bnd-ink);font-weight:600}

/* o único bloco com peso na tela */
.agora{background:var(--bnd-ink);color:var(--bnd-white);border-radius:var(--bnd-radius);
 padding:30px 32px;margin-bottom:44px}
.agora .k{font-size:11.2px;letter-spacing:1.12px;color:rgba(255,255,255,.45);margin-bottom:12px}
.agora h2{font-family:var(--bnd-display);font-weight:800;font-size:clamp(22px,2.4vw,31px);
 line-height:1.15;letter-spacing:-.5px;margin:0 0 8px}
.agora p{color:rgba(255,255,255,.6);font-size:14.5px;line-height:1.5;margin:0 0 22px;max-width:60ch}
.agora .btn{background:var(--bnd-lime);color:var(--bnd-ink);border:0}
.agora .btn--g{background:none;color:var(--bnd-white);border:1px dashed rgba(255,255,255,.3)}
.agora.travado{background:var(--bnd-lime);color:var(--bnd-ink)}
.agora.travado .k{color:rgba(16,16,16,.45)}
.agora.travado p{color:rgba(16,16,16,.6)}
.agora.travado .btn{background:var(--bnd-ink);color:var(--bnd-white)}

/* a lista de fases É a linha do tempo */
.grupo{font-size:11.2px;letter-spacing:1.12px;color:var(--ink-25);margin:32px 0 4px}
.grupo:first-of-type{margin-top:0}
.fase{border-bottom:var(--bnd-rule-soft)}
.fase>summary{list-style:none;cursor:pointer;padding:16px 4px;display:flex;align-items:baseline;gap:16px}
.fase>summary::-webkit-details-marker{display:none}
.fase>summary:hover .nm{text-decoration:underline;text-underline-offset:3px}
.fase .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
 color:var(--ink-25);min-width:26px}
.fase .nm{flex:1;font-size:15.5px}
.fase.feita .nm,.fase.feita .code{color:var(--ink-25)}
.fase.aqui .nm{font-family:var(--bnd-display);font-weight:800;font-size:17px}
.fase .cnt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-25)}
.fase .anc{font-size:11.5px;color:var(--ink-50)}
.fase .body{padding:2px 4px 26px 42px}
.tk{display:flex;align-items:flex-start;gap:11px;padding:7px 0;font-size:14.5px}
.tk input{margin-top:3px;accent-color:var(--bnd-ink);width:15px;height:15px}
.tk.done span{color:var(--ink-25)}
.ex{display:inline-block;background:var(--bnd-white);border-radius:9px;padding:8px 12px;
 margin:0 6px 6px 0;font-size:13.5px;text-decoration:none}
.ex:hover{outline:1px solid var(--ink-25)}
.ex b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--ink-50);margin-right:7px}
.rot{font-size:11.2px;letter-spacing:1.12px;color:var(--ink-25);margin:20px 0 8px}
.ancora{margin-top:20px;padding:18px 20px;border-radius:12px;background:var(--bnd-lime)}
.ancora .t{font-size:11.2px;letter-spacing:1.12px;font-weight:600;margin-bottom:8px}
.ancora textarea{width:100%;padding:10px 12px;border:1px solid var(--ink-10);border-radius:10px;
 background:var(--bnd-white);font:inherit;min-height:58px;outline:none;margin-bottom:10px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.mini{font-size:12px;color:var(--ink-50)}
.objlink{display:inline-block;margin-top:12px;font-size:13.5px;color:var(--ink-50);
 border-bottom:1px dashed var(--ink-25);text-decoration:none;cursor:pointer}
.obj{background:var(--bnd-lime);border-radius:var(--bnd-radius);padding:22px 24px;margin-bottom:44px}
.obj textarea{width:100%;border:0;background:transparent;font:inherit;font-family:var(--bnd-display);
 font-weight:800;font-size:18px;line-height:1.35;resize:vertical;min-height:46px;outline:none}
.obj textarea::placeholder{font-weight:400;color:rgba(16,16,16,.4)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bnd-ink);
 color:var(--bnd-white);padding:11px 18px;border-radius:99px;font-size:13.5px;opacity:0;
 pointer-events:none;transition:opacity .2s;z-index:50;max-width:80vw}
.toast.on{opacity:1}
.skel{background:var(--ink-10);border-radius:8px;height:14px;margin-bottom:9px;animation:p 1.1s infinite}
@keyframes p{0%,100%{opacity:.5}50%{opacity:.9}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/shared/logo.svg" alt="Bondioli" onerror="this.outerHTML='<b style=&quot;font-family:var(--bnd-display);font-weight:800;font-size:16px&quot;>BOND</b>'">
      <span>estratégia</span>
    </div>
    <div class="navsec">Trabalho</div>
    <a class="navbtn" href="/estrategia/">Projetos</a>
    <a class="navbtn on" id="lkProj" href="#">Este projeto</a>
    <a class="navbtn" id="lkWs" href="#">Conduzir workshop</a>
    <div class="navsec">Consulta</div>
    <a class="navbtn" href="/estrategia/metodo/PLAYBOOK-NAVE.html">Playbook N.A.V.E.</a>
    <a class="navbtn" href="/estrategia/exercicio.html">Catálogo de exercícios</a>
    <div class="navsec">Conta</div>
    <button class="navbtn" onclick="NAVE.logout()">Sair</button>
  </aside>

  <main class="main">
    <div class="topo">
      <div class="crumb" id="crumb"><a href="/estrategia/">Projetos</a></div>
      <h1 id="titulo">&nbsp;</h1>
      <div class="linha" id="linha"></div>
    </div>
    <div id="conteudo">
      <div class="skel" style="width:55%"></div><div class="skel" style="width:35%"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/estrategia/config.js"></script>
<script src="/estrategia/nave.js"></script>
<script>
const PROJ = new URLSearchParams(location.search).get('p');
const MACRO = { PRE:'pré', COLETANDO:'coletando', EXPLORANDO:'explorando',
                CRIANDO:'criando', DEFININDO:'definindo', POS:'pós' };
let D=null, EX=[];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),3400); }

function estado(){
  const fases = D.phases.map(pp => ({ pp, f: pp.nave_phases || {} }));
  const atual = fases.find(x => x.pp.status !== 'concluido') || fases[fases.length-1];
  const trava = fases.find(x => x.f.is_gate && x.f.ord < atual.f.ord && x.pp.gate !== 'aprovado');
  const tarefas = D.tasks.filter(t => t.project_phase_id === atual.pp.id);
  return { fases, atual, trava, tarefas, proxima: tarefas.find(t => t.status !== 'concluido'),
           feitas: fases.filter(x => x.pp.status === 'concluido').length,
           tarefasFeitas: D.tasks.filter(t => t.status === 'concluido').length };
}

function render(){
  const e = estado(), f = e.atual.f, pp = e.atual.pp;
  const espera = e.fases.filter(x => x.f.is_gate && x.pp.gate === 'enviado');

  // uma linha resolve o que três cartões não resolviam
  $('linha').innerHTML =
    `${esc(D.client ? D.client.name : '')} · fase <b>${e.feitas+1} de ${e.fases.length}</b>` +
    ` · ${e.tarefasFeitas} de ${D.tasks.length} tarefas` +
    (D.project.target_end ? ` · entrega ${new Date(D.project.target_end+'T12:00').toLocaleDateString('pt-BR')}` : '') +
    (espera.length ? ` · <b>${espera.length} entrega com o cliente</b>` : '');

  let html;
  if (e.trava) {
    html = `<div class="agora travado">
      <div class="k">travado</div>
      <h2>${esc(e.trava.f.gate_label || 'Âncora pendente')}</h2>
      <p>Sem a aprovação da fase ${e.trava.f.id} o projeto não avança. Não é regra de tela: o banco recusa.</p>
      <div class="acoes" style="margin:0"><button class="btn" onclick="irFase('${e.trava.pp.id}')">registrar a aprovação</button></div>
    </div>`;
  } else {
    html = `<div class="agora">
      <div class="k">agora</div>
      <h2>${e.proxima ? esc(e.proxima.title) : 'Fase ' + f.id + ' sem tarefa pendente'}</h2>
      <p>${f.id} · ${esc(f.name)}. ${esc(f.objective || '')}</p>
      <div class="acoes" style="margin:0">
        ${e.proxima ? `<button class="btn" onclick="feito('${e.proxima.id}')">marcar como feita</button>` : ''}
        ${f.id==='F3' ? `<a class="btn btn--g" href="/estrategia/workshop.html?p=${PROJ}">conduzir o workshop</a>` : ''}
        ${f.id==='F0' ? `<a class="btn btn--g" href="/estrategia/exercicio.html?ex=C1&p=${PROJ}">abrir as 7 perguntas</a>` : ''}
        ${!e.proxima && pp.status!=='concluido' && !f.is_gate
          ? `<button class="btn btn--g" onclick="mudarFase('${pp.id}','concluido')">concluir a fase</button>` : ''}
      </div></div>`;
  }

  // o objetivo só ocupa espaço quando existe
  const obj = D.project.main_objective;
  html += obj
    ? `<div class="obj"><div class="mini" style="margin-bottom:8px">objetivo principal · N7</div>
       <textarea id="obj">${esc(obj)}</textarea></div>`
    : `<a class="objlink" onclick="pedeObjetivo()">definir o objetivo principal do projeto · exercício N7</a>
       <div style="height:34px"></div>`;

  let macro = null;
  e.fases.forEach(x => {
    const ff = x.f, p = x.pp;
    if (ff.macro !== macro) { macro = ff.macro; html += `<div class="grupo">${MACRO[macro]||macro}</div>`; }
    const tks = D.tasks.filter(t => t.project_phase_id === p.id);
    const ok = tks.filter(t => t.status==='concluido').length;
    const exs = EX.filter(y => y.phase_id === ff.id);
    const cls = [ p.status==='concluido'?'feita':'', x===e.atual?'aqui':'' ].filter(Boolean).join(' ');
    html += `
    <details class="fase ${cls}" id="fase_${p.id}" ${x===e.atual?'open':''}>
      <summary>
        <span class="code">${ff.id}</span>
        <span class="nm">${esc(ff.name)}</span>
        ${ff.is_gate ? `<span class="anc">${p.gate==='aprovado'?'● âncora solta':(p.gate==='enviado'?'○ com o cliente':'○ âncora')}</span>` : ''}
        <span class="cnt">${ok}/${tks.length}</span>
      </summary>
      <div class="body">
        <p class="mini" style="margin:0 0 14px">${esc(ff.objective||'')}</p>
        ${tks.map(t => `<label class="tk ${t.status==='concluido'?'done':''}">
          <input type="checkbox" ${t.status==='concluido'?'checked':''} onchange="feito('${t.id}', this)">
          <span>${esc(t.title)}</span></label>`).join('')}
        ${exs.length ? `<div class="rot">exercícios</div>${exs.map(y =>
          `<a class="ex" href="/estrategia/exercicio.html?ex=${y.id}&p=${PROJ}"><b>${y.id}</b>${esc(y.name)}</a>`).join('')}` : ''}
        <div class="acoes">
          ${p.status!=='em_andamento' ? `<button class="btn btn--line" onclick="mudarFase('${p.id}','em_andamento')">iniciar</button>`:''}
          ${p.status!=='concluido' ? `<button class="btn btn--line" onclick="mudarFase('${p.id}','concluido')">concluir</button>`:''}
          ${ff.id==='F3' ? `<a class="btn btn--line" href="/estrategia/workshop.html?p=${PROJ}">conduzir workshop</a>`:''}
        </div>
        ${ff.is_gate ? ancora(p, ff) : ''}
      </div></details>`;
  });

  $('conteudo').innerHTML = html;
  const t = $('obj');
  if (t) t.addEventListener('blur', () => salvarObjetivo(t.value));
}

function ancora(p, f){
  if (p.gate === 'aprovado')
    return `<div class="ancora"><div class="t">${esc(f.gate_label||'Âncora')}</div>
      <div class="mini">Aprovada${p.approved_at?' em '+new Date(p.approved_at).toLocaleDateString('pt-BR'):''}. ${esc(p.gate_note||'')}</div></div>`;
  return `<div class="ancora">
    <div class="t">${esc(f.gate_label||'Âncora')}</div>
    <textarea id="gn_${p.id}" placeholder="Como o cliente aprovou? Em reunião, por e-mail, com quais ajustes?">${esc(p.gate_note||'')}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="mudarGate('${p.id}','aprovado')">registrar aprovação</button>
      <button class="btn btn--line" onclick="mudarGate('${p.id}','enviado')">enviado ao cliente</button>
      <button class="btn btn--line" onclick="mudarGate('${p.id}','ajustes_pedidos')">pediu ajustes</button>
    </div></div>`;
}

async function salvarObjetivo(v){
  if (v === (D.project.main_objective||'')) return;
  try { await NAVE.post('projeto_upd', {id:PROJ, main_objective:v});
    D.project.main_objective = v; toast('Objetivo salvo.'); }
  catch (e) { toast(e.message); }
}
function pedeObjetivo(){
  D.project.main_objective = ' '; render();
  const t = $('obj'); if (t) { t.value=''; t.focus(); }
}
async function feito(id, el){
  const t = D.tasks.find(x => x.id === id);
  const novo = el ? el.checked : true;
  try { await NAVE.post('tarefa', {id, status: novo?'concluido':'nao_iniciado'});
    if (t) t.status = novo?'concluido':'nao_iniciado'; render(); }
  catch (e) { if (el) el.checked = !novo; toast(e.message); }
}
async function mudarFase(id, status){
  try { await NAVE.post('fase',{id,status}); await carregar(); }
  catch (e) { toast(e.message); }
}
async function mudarGate(id, gate){
  const n = ($('gn_'+id)||{}).value || null;
  try { await NAVE.post('fase',{id,gate,gate_note:n}); await carregar(); }
  catch (e) { toast(e.message); }
}
function irFase(id){
  const d = $('fase_'+id);
  if (d) { d.open = true; d.scrollIntoView({block:'center', behavior:'smooth'}); }
}

async function carregar(){
  const [proj, cat] = await Promise.all([ NAVE.get('projeto',{id:PROJ}), NAVE.catalogo() ]);
  D = proj; EX = cat.exercises;
  const cli = proj.client ? proj.client.name : 'Cliente';
  $('crumb').innerHTML = `<a href="/estrategia/">Projetos</a>`;
  $('titulo').textContent = proj.project.name;
  $('lkProj').href = '/estrategia/projeto.html?p=' + PROJ;
  $('lkWs').href = '/estrategia/workshop.html?p=' + PROJ;
  document.title = cli + ' · ' + proj.project.name;
  render();
}

(async function(){
  if (!await NAVE.guard()) return;
  if (!PROJ) { location.replace('/estrategia/'); return; }
  try { await carregar(); }
  catch (e) { $('conteudo').innerHTML = `<p class="mini">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
