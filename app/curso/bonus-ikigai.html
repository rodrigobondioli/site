<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Ikigai do Nicho — Bônus</title>
<link rel="icon" type="image/png" href="/shared/favicon.png">
<style>
@font-face{font-family:Vinila;src:url(/shared/fonts/vinila-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vinila;src:url(/shared/fonts/vinila-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Vinila;src:url(/shared/fonts/vinila-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--surface:#f1f1f1;--soft:#e6e6e8;--line:#d4d4d8;--ink:#18181b;--muted:#71717a;--lime:#e7f99a;--pink:#ff00d7;--cyan:#00fff6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vinila,-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mk{display:inline-flex}.mk svg{width:100%;height:100%;display:block}
.top{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;justify-self:start}
.logo .m{width:28px;height:28px}
.tabs{display:flex;align-items:center;gap:2px;justify-self:center}
.tabs a{padding:7px 15px;border-radius:8px;color:var(--muted);font-weight:400;font-size:14px}
.tabs a:hover{background:var(--soft);color:var(--ink)}
.tabs a.on{background:var(--soft);color:var(--ink);font-weight:700}
.top .right{justify-self:end;display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:999px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pagehead{border-bottom:1px solid var(--line)}
.pagehead .ph-in{padding:19px 40px;font-weight:700;font-size:16px}
.pagehead .ph-in a{color:inherit}
.pagehead .ph-in a:hover{color:var(--muted)}
.main{padding:36px 40px 90px}
.inner{max-width:680px;margin:0 auto}
.kicker{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--muted)}
.ptitle{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.02;margin:8px 0 14px;text-wrap:balance}
.intro{color:var(--muted);font-size:15.5px;max-width:60ch;margin-bottom:26px;text-wrap:pretty}
.intro b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:999px;background:var(--pink);color:#fff}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:700}
.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:default}

/* progress */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.prog .bar{flex:1;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:999px;transition:width .25s}
.prog .n{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* step */
.qd{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:14px}
.qd i{width:10px;height:10px;border-radius:999px;display:inline-block}
.qd.amor i{background:var(--lime)} .qd.dom i{background:var(--cyan)} .qd.mercado i{background:var(--ink)} .qd.acesso i{background:var(--pink)}
.qtitle{font-size:clamp(22px,3.4vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.qhint{color:var(--muted);font-size:15px;margin-top:8px}
.qex{color:var(--muted);font-size:13.5px;margin-top:10px;font-style:italic}
textarea{width:100%;margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none;min-height:120px;resize:vertical;line-height:1.5}
textarea:focus{border-color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.nav .r{margin-left:auto;display:flex;gap:10px}

/* review */
.rev{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.rev .row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.rev .row:last-child{border-bottom:1px solid var(--line)}
.rev .rq{flex:1}
.rev .rq .rl{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.rev .rq .ra{font-size:15px;color:var(--ink);text-wrap:pretty}
.rev .rq .ra.empty{color:var(--muted);font-style:italic}
.rev .row .ed{font-size:13px;font-weight:700;color:var(--muted)}
.rev .row .ed:hover{color:var(--ink)}

/* result */
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--ink);border-radius:999px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cand{background:#fff;border-radius:14px;padding:20px 20px;margin-bottom:14px}
.cand .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cand h3{font-size:19px;font-weight:800;letter-spacing:-.01em;text-wrap:balance;flex:1;min-width:200px}
.chip{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip.alta{background:var(--lime)} .chip.media{background:var(--cyan)}
.cand p{font-size:14.5px;margin-top:10px;line-height:1.55;text-wrap:pretty}
.cand .risk{color:var(--muted);font-size:13.5px;margin-top:8px}
.box{border-radius:12px;padding:16px 18px;font-size:15px;line-height:1.55;margin-bottom:12px;text-wrap:pretty}
.box.conv{background:var(--cyan)} .box.falta{background:var(--soft)}
.box b{color:var(--ink)}
.plan{background:var(--lime);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.plan h4{font-size:13px;font-weight:800;margin-bottom:10px}
.plan ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.plan li{font-size:14.5px;line-height:1.5}
.err{background:#fff;border-radius:12px;padding:16px 18px;color:var(--ink);font-size:14.5px;margin-bottom:14px}
.h-res{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:6px 0 16px}
.muted-note{color:var(--muted);font-size:13px;margin-top:6px}
@media(max-width:820px){.tabs{display:none}.top{grid-template-columns:1fr auto}.main{padding:26px 18px 72px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="/curso/home.html">
    <span class="m mk"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#l0)"><rect width="64" height="64" rx="32" fill="#E7F99A"/><path fill-rule="evenodd" clip-rule="evenodd" d="M20.5867 34.7487L20.5867 17.9659L28.1653 22.3413C28.1961 22.6142 28.211 22.8796 28.211 23.1312L28.211 34.7487C28.211 36.8541 29.9172 38.5603 32.0226 38.5603C34.128 38.5603 35.8352 36.853 35.8352 34.7487C35.8352 33.0541 34.73 31.6187 33.2021 31.1218C32.1776 30.7884 31.0553 30.9042 30.1178 31.4456L30.1178 23.4688C31.4896 23.2374 32.8996 23.2618 34.2639 23.5325C39.5077 24.5741 43.4606 29.199 43.4606 34.7497C43.4606 41.0659 38.3409 46.1867 32.0236 46.1867C30.6869 46.1867 29.4043 45.9573 28.212 45.5358C23.7697 43.9655 20.5877 39.7292 20.5877 34.7497L20.5867 34.7487Z" fill="#18181b"/></g><defs><clipPath id="l0"><rect width="64" height="64" rx="32" fill="white"/></clipPath></defs></svg></span>
    anti designer pato
  </a>
  <nav class="tabs">
    <a href="/curso/home.html">Início</a>
    <a href="/cursos">Cursos</a>
    <a href="#">Comunidade</a>
  </nav>
  <div class="right"><span class="avatar"><img src="/app/eu-login.webp" alt="Rodrigo"></span></div>
</header>

<div class="pagehead"><div class="ph-in"><a href="/curso/bonus.html">Bônus</a> · O Ikigai do Nicho</div></div>

<main class="main">
  <div class="inner" id="app"><!-- render dinâmico --></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app/config.js"></script>
<script src="/app/curso/guard.js"></script>
<script src="/app/curso/api.js"></script>
<script src="/app/curso/ui.js"></script>
<script>
(function(){
  var KEY = "adp_ikigai_v1";
  var Q = [
    {k:'amor_projetos', quad:'amor', label:'O que você ama', title:'Que tipos de projeto te acendem?', hint:'Aqueles que você faria nem que pagasse pouco.', ex:'identidade de marca, embalagem, social de restaurante, motion…'},
    {k:'amor_mundos', quad:'amor', label:'O que você ama', title:'Que mundos ou assuntos você curte de verdade?', hint:'Fora do design. Onde você já é “de casa”.', ex:'games, gastronomia, fitness, moda, pet, música, carro…'},
    {k:'dom_forte', quad:'dom', label:'No que você é bom', title:'O que você entrega melhor que a média?', hint:'Onde o cliente já te elogiou ou pediu de novo.', ex:'landing que converte, direção de arte, naming, ilustração…'},
    {k:'dom_prova', quad:'dom', label:'No que você é bom', title:'Um resultado concreto que você já gerou.', hint:'Número, antes/depois, um case real. Prova, não achismo.', ex:'“subi a conversão da loja de 1% pra 2,4%”, “o rebrand dobrou o ticket”…'},
    {k:'mercado_quem', quad:'mercado', label:'O que o mercado paga', title:'Que tipo de empresa já te pagou bem — ou paga bem no mercado?', hint:'Setores com verba pra design.', ex:'clínicas, e-commerce, infoproduto, indústria, construtora…'},
    {k:'mercado_dor', quad:'mercado', label:'O que o mercado paga', title:'Que dor cara essas empresas têm que o design resolve?', hint:'O que elas pagariam AGORA pra sumir.', ex:'“não vende no site”, “parece amador do lado do concorrente”, “ninguém entende o que ela faz”…'},
    {k:'acesso_porta', quad:'acesso', label:'Onde você tem entrada', title:'Onde você tem porta de entrada?', hint:'Rede, ex-clientes, comunidades que você já frequenta.', ex:'“conheço vários donos de restaurante”, “jogo num time amador”, “minha família tem clínica”…'},
    {k:'acesso_chute', quad:'acesso', label:'Onde você tem entrada', title:'Se você fosse “o designer de ___”, o que preencheria hoje?', hint:'Chute inicial, sem medo de errar.', ex:'“clínicas de estética”, “hamburgueria artesanal”, “estúdio de tatuagem”…'}
  ];
  var QUADNAME = {amor:'O que você ama', dom:'No que você é bom', mercado:'O que o mercado paga', acesso:'Onde você tem entrada'};

  var state = load() || { step:-1, answers:{}, result:null };
  var app = document.getElementById('app');

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function answered(){ return Q.filter(function(q){ return (state.answers[q.k]||'').trim(); }).length; }

  function render(){
    if(state.result){ return renderResult(state.result); }
    if(state.step === -1){ return renderIntro(); }
    if(state.step >= Q.length){ return renderReview(); }
    return renderStep();
  }

  function renderIntro(){
    app.innerHTML =
      '<p class="kicker">Quando você trava</p>'+
      '<h1 class="ptitle">O Ikigai do Nicho</h1>'+
      '<p class="intro">Travou pra achar o nicho? Isto aqui cruza o que você <b>ama</b>, o que <b>faz bem</b>, o que o <b>mercado paga</b> e onde você tem <b>acesso</b> — e devolve candidatos de nicho concretos pra você testar. São 8 perguntas curtas, uma por tela. Responde na lata, sem caprichar demais.</p>'+
      (window.ADP && window.ADP.devMode ? '<p class="muted-note">Modo de teste: a geração por IA só roda logado como aluno.</p>' : '')+
      '<div class="nav"><span></span><div class="r">'+
        (answered() ? '<button class="btn ghost" id="clr">Recomeçar</button>' : '')+
        '<button class="btn" id="go">'+(answered()?'Continuar':'Começar')+' →</button>'+
      '</div></div>';
    document.getElementById('go').onclick = function(){ state.step = firstUnanswered(); save(); render(); };
    var clr = document.getElementById('clr'); if(clr) clr.onclick = resetAll;
  }
  function firstUnanswered(){ for(var i=0;i<Q.length;i++){ if(!(state.answers[Q[i].k]||'').trim()) return i; } return Q.length; }

  function renderStep(){
    var q = Q[state.step];
    var pct = Math.round((state.step)/Q.length*100);
    app.innerHTML =
      '<div class="prog"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="n">'+(state.step+1)+' de '+Q.length+'</span></div>'+
      '<div class="qd '+q.quad+'"><i></i>'+esc(q.label)+'</div>'+
      '<h2 class="qtitle">'+esc(q.title)+'</h2>'+
      '<p class="qhint">'+esc(q.hint)+'</p>'+
      '<p class="qex">ex: '+esc(q.ex)+'</p>'+
      '<textarea id="ta" placeholder="Escreve aqui…">'+esc(state.answers[q.k]||'')+'</textarea>'+
      '<div class="nav">'+
        '<button class="btn ghost" id="back">← Voltar</button>'+
        '<div class="r"><button class="btn" id="next">'+(state.step===Q.length-1?'Revisar':'Próxima')+' →</button></div>'+
      '</div>';
    var ta = document.getElementById('ta');
    ta.focus();
    ta.oninput = function(){ state.answers[q.k] = ta.value; save(); };
    document.getElementById('back').onclick = function(){ state.answers[q.k]=ta.value; state.step--; save(); render(); };
    document.getElementById('next').onclick = function(){ state.answers[q.k]=ta.value; state.step++; save(); render(); };
  }

  function renderReview(){
    var rows = Q.map(function(q,i){
      var a = (state.answers[q.k]||'').trim();
      return '<div class="row"><div class="rq"><div class="rl">'+esc(QUADNAME[q.quad])+' · '+esc(q.title)+'</div>'+
        '<div class="ra'+(a?'':' empty')+'">'+(a?esc(a):'(em branco)')+'</div></div>'+
        '<button class="ed" data-i="'+i+'">editar</button></div>';
    }).join('');
    app.innerHTML =
      '<p class="kicker">Revisão</p>'+
      '<h1 class="ptitle">Confere antes de gerar</h1>'+
      '<p class="intro">Quanto mais concreto, melhor o cruzamento. Faltou algo? Edita. Tá bom? Manda a IA cruzar.</p>'+
      '<div class="rev">'+rows+'</div>'+
      '<div class="nav"><button class="btn ghost" id="back">← Voltar</button>'+
        '<div class="r"><button class="btn" id="gen">Gerar candidatos de nicho →</button></div></div>'+
      (window.ADP && window.ADP.devMode ? '<p class="muted-note">Modo de teste: a geração por IA só roda logado como aluno.</p>' : '');
    Array.prototype.forEach.call(app.querySelectorAll('.ed'), function(b){
      b.onclick = function(){ state.step = +b.getAttribute('data-i'); save(); render(); };
    });
    document.getElementById('back').onclick = function(){ state.step = Q.length-1; save(); render(); };
    document.getElementById('gen').onclick = generate;
  }

  function renderLoading(){
    app.innerHTML = '<div class="loading"><div class="spin"></div><p>Cruzando as quatro frentes e montando teus candidatos…</p></div>';
  }

  async function generate(){
    renderLoading();
    try {
      if(!window.ADP || window.ADP.devMode){ throw new Error('Entra com o teu login de aluno pra gerar — a IA roda logada.'); }
      var r = await window.ADP.ikigai(state.answers);
      state.result = (r && r.data) || {};
      save(); renderResult(state.result);
    } catch(e){
      renderReviewError(e.message || 'Deu ruim. Tenta de novo.');
    }
  }
  function renderReviewError(msg){
    renderReview();
    var box = document.createElement('div'); box.className='err'; box.textContent = msg;
    var inner = document.getElementById('app'); inner.insertBefore(box, inner.querySelector('.rev').nextSibling);
  }

  function renderResult(d){
    if(d && d.raw && !d.candidatos){
      app.innerHTML = '<p class="kicker">Teus candidatos</p><h1 class="ptitle">O Ikigai do Nicho</h1>'+
        '<div class="err">'+esc(d.raw)+'</div>'+resultFoot();
      wireFoot(); return;
    }
    var cands = (d && d.candidatos) || [];
    var html = '<p class="kicker">Teus candidatos</p><h1 class="ptitle">Onde o teu nicho se cruza</h1>';
    if(!cands.length){ html += '<div class="err">A IA não devolveu candidatos. Volta e detalha mais as respostas.</div>'; }
    cands.forEach(function(c){
      var f = (c.forca||'').toLowerCase();
      html += '<div class="cand"><div class="ch"><h3>'+esc(c.nicho||'—')+'</h3>'+
        (c.forca?'<span class="chip '+(f==='alta'?'alta':(f==='media'||f==='média'?'media':''))+'">'+esc(c.forca)+'</span>':'')+'</div>'+
        (c.porque?'<p>'+esc(c.porque)+'</p>':'')+
        (c.risco?'<p class="risk"><b>Furo/risco:</b> '+esc(c.risco)+'</p>':'')+'</div>';
    });
    if(d && d.convergencia){ html += '<div class="box conv"><b>Onde converge:</b> '+esc(d.convergencia)+'</div>'; }
    if(d && d.faltando){ html += '<div class="box falta"><b>O que falta:</b> '+esc(d.faltando)+'</div>'; }
    if(d && d.plano && d.plano.length){
      html += '<div class="plan"><h4>Próximos passos</h4><ol>'+d.plano.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ol></div>';
    }
    html += resultFoot();
    app.innerHTML = html;
    wireFoot();
  }
  function resultFoot(){
    return '<div class="nav" style="margin-top:22px"><span></span><div class="r">'+
      '<button class="btn ghost" id="again">Refazer</button>'+
      '<a class="btn ghost" href="/curso/canvas.html">Levar pro Canvas →</a>'+
      '</div></div>';
  }
  function wireFoot(){
    var a = document.getElementById('again');
    if(a) a.onclick = function(){ state.result = null; state.step = Q.length; save(); render(); };
  }

  function resetAll(){
    state = { step:-1, answers:{}, result:null }; save(); render();
  }

  render();
})();
</script>
</body>
</html>
